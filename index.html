<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
/* Two fields, one canvas, strictly divided by the hairline between the panels.
   Left  — a measured system: grid, axis, a damped oscillation sampled into stems
           and markers (data as physics: something observed and plotted).
   Right — an unmeasured one: drifting lissajous gesture, no grid, no baseline.
   Each field is clipped to its own panel's rect, read from the DOM, so it works
   in both the two-column and the stacked layout. rAF + canvas keeps it smooth
   and off the layout path; all type stays in the template. */
class Component extends DCLogic {
  state = { hover: null };

  renderVals() {
    const h = this.state.hover;
    return {
      fieldRef: (el) => { this.canvas = el; if (el) this.start(); },
      workRef: (el) => { this.workEl = el; },
      eyeRef: (el) => { this.eyeEl = el; },
      // Free the frame budget for the outgoing curtain: the field is covered anyway.
      freeze: () => { this.stop(); this.running = false; },
      enterWork: () => { this.target = 'work'; this.setState({ hover: 'work' }); },
      enterEye: () => { this.target = 'eye'; this.setState({ hover: 'eye' }); },
      leave: () => { this.target = null; this.setState({ hover: null }); },
      workBg: h === 'work' ? '#12151C' : 'transparent',
      eyeBg: h === 'eye' ? '#15130F' : 'transparent',
      workRule: h === 'work' ? '84px' : '34px',
      eyeRule: h === 'eye' ? '84px' : '34px'
    };
  }

  componentWillUnmount() { this.stop(); }

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.ro) { this.ro.disconnect(); this.ro = null; }
    if (this.onResize) { window.removeEventListener('resize', this.onResize); this.onResize = null; }
  }

  start() {
    if (this.running || !this.canvas) return;
    this.running = true;
    const cv = this.canvas, ctx = cv.getContext('2d');
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    let W = 0, H = 0, dpr = 1, base = null;
    let workGain = 0, eyeGain = 0;
    this.target = this.target || null;

    const size = () => {
      base = cv.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.max(1, Math.round(base.width));
      H = Math.max(1, Math.round(base.height));
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    size();
    if (window.ResizeObserver) { this.ro = new ResizeObserver(size); this.ro.observe(cv); }
    else { this.onResize = size; window.addEventListener('resize', size); }

    // panel rect in canvas space, with a small inset so nothing touches the hairline
    const rectOf = (el) => {
      if (!el) return null;
      const b = cv.getBoundingClientRect(), r = el.getBoundingClientRect();
      const x = r.left - b.left, y = r.top - b.top;
      if (r.width < 8 || r.height < 8) return null;
      return { x: x + 1, y: y, w: r.width - 2, h: r.height };
    };

    /* ---- left: measured ---- */
    const drawMeasured = (R, t, gain) => {
      // Grid pitch follows the panel's smaller side so cells stay square-ish
      // and the plot never compresses into a short, wide panel on a phone.
      const stepX = Math.max(22, Math.min(38, Math.min(R.w, R.h) / 11));
      const axis = R.y + R.h * 0.44;

      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip();

      // reference grid
      ctx.strokeStyle = 'rgba(126,147,201,' + (0.055 + 0.05 * gain).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = R.x + stepX; x < R.x + R.w; x += stepX) { ctx.moveTo(Math.round(x) + .5, R.y); ctx.lineTo(Math.round(x) + .5, R.y + R.h); }
      for (let y = axis; y > R.y; y -= stepX) { ctx.moveTo(R.x, Math.round(y) + .5); ctx.lineTo(R.x + R.w, Math.round(y) + .5); }
      for (let y = axis + stepX; y < R.y + R.h; y += stepX) { ctx.moveTo(R.x, Math.round(y) + .5); ctx.lineTo(R.x + R.w, Math.round(y) + .5); }
      ctx.stroke();

      // axis
      ctx.strokeStyle = 'rgba(126,147,201,' + (0.34 + 0.2 * gain).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(R.x, Math.round(axis) + .5); ctx.lineTo(R.x + R.w, Math.round(axis) + .5); ctx.stroke();

      // damped oscillation: y = A e^(-kx) sin(wx - vt)
      const A = Math.min(R.h * 0.3, R.w * 0.26) * (1 + 0.28 * gain);
      // Wavelength scales with panel width so the same number of cycles shows
      // at any size, instead of a wide panel reading as a flat line.
      const w = (Math.PI * 2 * 2.6) / R.w, k = 1.5 / R.w, v = 1.05;
      const yAt = (x) => {
        const d = x - R.x;
        return axis + A * Math.exp(-k * d) * Math.sin(w * d - t * v);
      };

      ctx.strokeStyle = 'rgba(143,168,224,' + (0.5 + 0.35 * gain).toFixed(3) + ')';
      ctx.lineWidth = 1.25;
      ctx.beginPath();
      for (let x = R.x; x <= R.x + R.w; x += 3) { if (x === R.x) ctx.moveTo(x, yAt(x)); else ctx.lineTo(x, yAt(x)); }
      ctx.stroke();

      // envelope, dotted — the model the data is measured against
      ctx.setLineDash([2, 5]);
      ctx.strokeStyle = 'rgba(143,168,224,' + (0.16 + 0.14 * gain).toFixed(3) + ')';
      ctx.lineWidth = 1;
      for (const s of [1, -1]) {
        ctx.beginPath();
        for (let x = R.x; x <= R.x + R.w; x += 4) {
          const y = axis + s * A * Math.exp(-k * (x - R.x));
          if (x === R.x) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // samples: stem to axis + square marker at each measurement
      for (let x = R.x + stepX / 2; x < R.x + R.w; x += stepX) {
        const y = yAt(x);
        ctx.strokeStyle = 'rgba(126,147,201,' + (0.2 + 0.24 * gain).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, axis); ctx.lineTo(Math.round(x) + .5, y); ctx.stroke();
        const m = 2.6 + 1.2 * gain;
        ctx.fillStyle = 'rgba(176,196,240,' + (0.55 + 0.3 * gain).toFixed(3) + ')';
        ctx.fillRect(x - m / 2, y - m / 2, m, m);
      }
      ctx.restore();
    };

    /* ---- right: unmeasured ---- */
    const drawUnmeasured = (R, t, gain) => {
      ctx.save();
      ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip();

      const cx = R.x + R.w * 0.5, cy = R.y + R.h * 0.5;
      // Radii off the panel's smaller side: the gesture keeps its proportions
      // in a tall phone panel or a wide desktop one instead of being squashed.
      // Fill the panel, but cap how far the gesture may stretch: the figure
      // keeps its character in a wide desktop panel and a short phone one alike.
      let rx = R.w * 0.44, ry = R.h * 0.38;
      const maxRatio = 1.7;
      if (rx / ry > maxRatio) rx = ry * maxRatio;
      else if (ry / rx > maxRatio) ry = rx * maxRatio;
      rx *= 1 + 0.07 * gain; ry *= 1 + 0.07 * gain;
      const N = 7;
      for (let i = 0; i < N; i++) {
        const f = i / (N - 1);
        const a = 2 + f * 1.15;                 // lissajous ratios drift apart per line
        const b = 3 - f * 0.9;
        const ph = t * (0.09 + 0.05 * f) + f * 2.1;
        const swell = 1 - f * 0.3 + 0.05 * Math.sin(t * 0.3 + i);
        ctx.beginPath();
        for (let s = 0; s <= 260; s++) {
          const u = (s / 260) * Math.PI * 2;
          const x = cx + Math.sin(a * u + ph) * rx * swell;
          const y = cy + Math.sin(b * u + ph * 1.3) * ry * swell;
          if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(201,184,146,' + ((0.05 + 0.09 * (1 - f)) * (1 + 1.5 * gain)).toFixed(3) + ')';
        ctx.lineWidth = 0.9 + (1 - f) * 0.5;
        ctx.stroke();
      }

      // a few slow bodies riding the gesture
      for (let i = 0; i < 3; i++) {
        const ph = t * 0.16 + i * 2.4;
        const x = cx + Math.sin(2.3 * ph) * rx * 0.72;
        const y = cy + Math.sin(3.1 * ph + 1.1) * ry * 0.72;
        ctx.beginPath();
        ctx.arc(x, y, 2.2 + i * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(214,198,162,' + (0.22 + 0.3 * gain).toFixed(3) + ')';
        ctx.fill();
      }
      ctx.restore();
    };

    const draw = (time) => {
      const t = time / 1000, g = this.target;
      workGain += ((g === 'work' ? 1 : 0) - workGain) * 0.06;
      eyeGain += ((g === 'eye' ? 1 : 0) - eyeGain) * 0.06;

      ctx.clearRect(0, 0, W, H);
      const A = rectOf(this.workEl), B = rectOf(this.eyeEl);
      if (A) drawMeasured(A, t, workGain);
      if (B) drawUnmeasured(B, t, eyeGain);

      if (!reduce) this.raf = requestAnimationFrame(draw);
    };

    if (reduce) { requestAnimationFrame(draw); return; }
    this.raf = requestAnimationFrame(draw);
  }
}
</script>
